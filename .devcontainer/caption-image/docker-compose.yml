name: aperturedb-local-caption-image

services:
  caption-image:
    build:
      context: ../../apps/caption-image
    volumes:
      - ../../:/workflows
    environment:
      WF_LOGS_AWS_CREDENTIALS: "aws-credentials"
      DB_HOST: lenz
      DB_PORT: 55551
      PORT: 8080
      PROMETHEUS_PORT: 8001
    command: bash -c "while true; do sleep 1000; done"
    depends_on:
      aperturedb:
        condition: service_started
