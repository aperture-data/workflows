name: CI-build-apps

on:
  pull_request:
    branches:
      - main

  # Weekly build (Wednesdays at 02:00 UTC)
  schedule:
    - cron: "0 2 * * 3"

  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set version
        id: set-version
        run: |
          echo "GitHub event: ${{ github.event_name }}"
          echo "GitHub ref: ${{ github.ref }}"

          VERSION=$(cat VERSION)
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid VERSION: expected MAJOR.MINOR.PATCH (no leading zeros)" >&2
            exit 1
          fi

          VERSION="v${VERSION}"

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            VERSION="pr-${{ github.event.number }}-${SHORT_SHA}"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            VERSION="adhoc-${SHORT_SHA}"
          fi
          echo "version=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-base:
    needs: get-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build base
        run: |
          cd base/docker
          WORKFLOW_VERSION=$VERSION bash build.sh

      - name: Build and export
        run: |
          docker save --output=${{ runner.temp }}/workflows-base.tar aperturedata/workflows-base:$VERSION

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflows-base
          path: ${{ runner.temp }}/workflows-base.tar

  test-base:
    needs: [build-base, get-version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download base image
        uses: actions/download-artifact@v4
        with:
          name: workflows-base
          path: ${{ runner.temp }}

      - name: Load base image
        run: |
          docker load --input=${{ runner.temp }}/workflows-base.tar

      - name: Test base modules
        run: |
          cd base/docker
          CI_RUN=1 bash test.sh

  build-test-apps-small:
    needs: [test-base, get-version]

    strategy:
      matrix:
        app:
          [
            object-detection,
            embeddings-extraction,
            face-detection,
            jupyterlab,
            mcp-server,
            crawl-website,
            text-extraction,
            text-embeddings,
            ingest-croissant,
            ingest-from-bucket,
            ingest-from-sql,
            sql-server,
            label-studio,
            ocr-extraction,
            caption-image,
            dataset-ingestion-movies,
          ]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: workflows-base
          path: ${{ runner.temp }}

      - name: Load image
        run: |
          docker load --input ${{ runner.temp }}/workflows-base.tar
          docker image ls -a

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ fromJson(secrets.DOCKERHUB).username }}
          DOCKERHUB_PASSWORD: ${{ fromJson(secrets.DOCKERHUB).password }}
        run: |
          printf '%s' "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - uses: actions/checkout@v3

      - name: Test app
        env:
          CLEANUP: "true"
          WF_LOGS_AWS_CREDENTIALS: ${{ secrets.WF_LOGS_AWS_CREDENTIALS }}
          WF_DATA_SOURCE_GCP_BUCKET: ${{ secrets.WF_DATA_SOURCE_GCP_BUCKET }}
          RUNNER_NAME: ${{ runner.name }}
          WORKFLOW_VERSION: $VERSION
          CI_RUN: 1
        run: |
          cd apps/${{ matrix.app }}
          if [ -f "test.sh" ]; then
            bash test.sh
          else
            bash ../build.sh
          fi

      - name: Push to docker (on main)
        # Only push to docker when merged to main
        # Pushing base to docker should be no-op after the first time
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push aperturedata/workflows-base:$VERSION
          docker push aperturedata/workflows-${{ matrix.app }}:$VERSION

  build-test-apps-large:
    needs: [test-base, get-version]

    strategy:
      matrix:
        app: [rag, crawl-to-rag, dataset-ingestion]

    runs-on: [self-hosted, X64]
    env:
      VERSION: ${{ needs.get-version.outputs.version }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: workflows-base
          path: ${{ runner.temp }}

      - name: Load image
        run: |
          docker load --input ${{ runner.temp }}/workflows-base.tar
          docker image ls -a

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ fromJson(secrets.DOCKERHUB).username }}
          DOCKERHUB_PASSWORD: ${{ fromJson(secrets.DOCKERHUB).password }}
        run: |
          printf '%s' "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - uses: actions/checkout@v3

      - name: Test app
        env:
          CLEANUP: "true"
          WF_LOGS_AWS_CREDENTIALS: ${{ secrets.WF_LOGS_AWS_CREDENTIALS }}
          WF_DATA_SOURCE_GCP_BUCKET: ${{ secrets.WF_DATA_SOURCE_GCP_BUCKET }}
          RUNNER_NAME: ${{ runner.name }}
          WORKFLOW_VERSION: $VERSION
          CI_RUN: 1
        run: |
          cd apps/${{ matrix.app }}
          if [ -f "test.sh" ]; then
            bash test.sh
          else
            bash ../build.sh
          fi

      # ⬇️ Upload logs even if the tests fail
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/test.log
          if-no-files-found: ignore

      - name: Push to docker (on main)
        # Only push to docker when merged to main
        # Pushing base to docker should be no-op after the first time
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push aperturedata/workflows-base:$VERSION
          docker push aperturedata/workflows-${{ matrix.app }}:$VERSION

  update-version:
    needs: [build-test-apps-small, build-test-apps-large, get-version]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
    env:
      VERSION: ${{ needs.get-version.outputs.version }}

    steps:
      - name: Update version on infra develop
        run: |
          curl -f -s -X POST \
          -H "Authorization: Bearer ${{ secrets.PAT_INFRA }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/aperture-data/infra/dispatches \
          -d "{\"event_type\": \"update-tag\", \"client_payload\": {\"component\": \"workflows-public\", \"tag\": \"${VERSION}\"}}"
