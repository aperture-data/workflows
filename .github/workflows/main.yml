name: Embedding phase diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  embedding-phase:
    runs-on: ubuntu-latest
    env:
      VERSION: pr-263-a854413
      APERTUREDB_VERSION: 1.0.0-rc.1
      DB_HOST: lenz
      DB_PORT: "55551"
      DB_PASS: admin
      DIAGNOSTIC_PROJECT: diagnostic-embedding-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c15fb48871c090f356c0591cbd452f22f5839aa9
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: workflows-base
          run-id: 44043174610
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/qualified-base

      - name: Initialize diagnostic clock
        run: date -u +%s > "$RUNNER_TEMP/embedding-start-time"

      - name: Load exact qualified base
        run: docker load --input "${{ runner.temp }}/qualified-base/workflows-base.tar"

      - name: Log in for ordinary dependency pulls
        env:
          DOCKERHUB_USERNAME: ${{ fromJson(secrets.DOCKERHUB).username }}
          DOCKERHUB_PASSWORD: ${{ fromJson(secrets.DOCKERHUB).password }}
        run: printf '%s' "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - uses: docker/setup-compose-action@v1
        with:
          version: v2.40.3

      - name: Original network-none unit precheck
        run: |
          set +e
          "$GITHUB_WORKSPACE/compose.sh" -p "$DIAGNOSTIC_PROJECT" -f "$GITHUB_WORKSPACE/docker-compose.yml" -f "$GITHUB_WORKSPACE/apps/embeddings-extraction/test/docker-compose.yml" run --rm --no-deps unit-tests
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/embedding-unit-exit"
          exit "$result"

      - name: Original test and application build
        run: |
          set +e
          "$GITHUB_WORKSPACE/compose.sh" -p "$DIAGNOSTIC_PROJECT" -f "$GITHUB_WORKSPACE/docker-compose.yml" -f "$GITHUB_WORKSPACE/apps/embeddings-extraction/test/docker-compose.yml" build test-base embeddings-extraction
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/embedding-build-exit"
          exit "$result"

      - name: Original seed and database startup only
        run: |
          set +e
          "$GITHUB_WORKSPACE/compose.sh" -p "$DIAGNOSTIC_PROJECT" -f "$GITHUB_WORKSPACE/docker-compose.yml" -f "$GITHUB_WORKSPACE/apps/embeddings-extraction/test/docker-compose.yml" up --no-build --exit-code-from seed seed
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/embedding-seed-exit"
          exit "$result"

      - name: Capture phase and selected container state only
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/embedding-phase-state"
          docker ps -aq --filter "label=com.docker.compose.project=$DIAGNOSTIC_PROJECT" |
          while IFS= read -r container_id; do
            docker inspect --format '{"service":{{json (index .Config.Labels "com.docker.compose.service")}},"state":{{json .State.Status}},"exit_code":{{.State.ExitCode}},"oom_killed":{{.State.OOMKilled}},"image_id":{{json .Image}},"started_at":{{json .State.StartedAt}},"finished_at":{{json .State.FinishedAt}}}' "$container_id"
          done | jq -s . > "$RUNNER_TEMP/embedding-phase-state/containers.json"
          start=$(cat "$RUNNER_TEMP/embedding-start-time")
          docker events --since "$start" --until "$(date -u +%s)" --filter type=container --filter event=oom --format '{"action":{{json .Action}},"container_id":{{json .Actor.ID}},"time":{{.Time}}}' | jq -s . > "$RUNNER_TEMP/embedding-phase-state/oom-events.json"
          unit=$(cat "$RUNNER_TEMP/embedding-unit-exit" 2>/dev/null || printf not_run)
          build=$(cat "$RUNNER_TEMP/embedding-build-exit" 2>/dev/null || printf not_run)
          seed=$(cat "$RUNNER_TEMP/embedding-seed-exit" 2>/dev/null || printf not_run)
          jq -n --arg unit "$unit" --arg build "$build" --arg seed "$seed" --slurpfile containers "$RUNNER_TEMP/embedding-phase-state/containers.json" --slurpfile oom "$RUNNER_TEMP/embedding-phase-state/oom-events.json" '{phases:{unit:$unit,build:$build,seed:$seed},containers:$containers[0],oom_events:$oom[0],model_application_started:false}' > "$RUNNER_TEMP/embedding-phase-state/phase-state.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedding-phase-state-${{ github.run_id }}
          path: ${{ runner.temp }}/embedding-phase-state/phase-state.json
          if-no-files-found: error

      - name: Clean only this disposable diagnostic project
        if: always()
        run: |
          "$GITHUB_WORKSPACE/compose.sh" -p "$DIAGNOSTIC_PROJECT" -f "$GITHUB_WORKSPACE/docker-compose.yml" -f "$GITHUB_WORKSPACE/apps/embeddings-extraction/test/docker-compose.yml" down --volumes --remove-orphans
