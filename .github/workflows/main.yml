name: CI-build-apps

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

  # Infra sends aperturedb-python when it moves the SDK wheels and notebook
  # images, which the apps build on, to a new dev release. The build resolves
  # them and skips the apps whose published images already match.
  repository_dispatch:
    types: [aperturedb-python]

env:
  # The tests run the ApertureDB Compose package at dev, the newest athena main
  # release. It is not part of any image, so the input hashes leave it out.
  APERTUREDB_VERSION: dev

jobs:
  get-version:
    runs-on: ubuntu-latest
    env:
      # The apps of build-test-apps-small and build-test-apps-large. Each run
      # builds, tests and pushes only the apps whose inputs changed.
      SMALL_APPS: >-
        object-detection embeddings-extraction face-detection jupyterlab
        mcp-server nexus crawl-website text-extraction text-embeddings
        ingest-croissant ingest-from-bucket ingest-from-sql sql-server
        label-studio ocr-extraction caption-image dataset-ingestion-movies
      LARGE_APPS: rag crawl-to-rag dataset-ingestion
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      sdk-ref: ${{ steps.sdk.outputs.ref }}
      workflows-ref: ${{ steps.sdk.outputs.workflows-ref }}
      notebook-cpu-image: ${{ steps.sdk.outputs.notebook-cpu-image }}
      input-hashes: ${{ steps.inputs.outputs.input-hashes }}
      build: ${{ steps.inputs.outputs.build }}
      small: ${{ steps.matrix.outputs.small }}
      large: ${{ steps.matrix.outputs.large }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: set-version
        run: |
          echo "GitHub event: ${{ github.event_name }}"
          echo "GitHub ref: ${{ github.ref }}"

          VERSION=$(cat VERSION)
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid VERSION: expected MAJOR.MINOR.PATCH (no leading zeros)" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            VERSION="pr-${{ github.event.number }}-${SHORT_SHA}"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            VERSION="adhoc-${SHORT_SHA}"
          fi
          echo "version=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0

      - name: Log in to Docker Hub to read published app images
        if: (github.event_name == 'push' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ fromJson(secrets.DOCKERHUB).username }}
          password: ${{ fromJson(secrets.DOCKERHUB).password }}

      # jupyterlab builds on the CPU notebook, the other apps on the wheels.
      - name: Resolve the SDK wheels and the CPU notebook
        id: sdk
        run: |
          ref=$(oras resolve --full-reference registry-1.docker.io/aperturedata/aperturedb-python:dev)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          ref=$(oras resolve --full-reference registry-1.docker.io/aperturedata/aperturedb-workflows:dev)
          echo "workflows-ref=$ref" >> "$GITHUB_OUTPUT"
          digest=$(oras resolve registry-1.docker.io/aperturedata/aperturedb-notebook-cpu:dev)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Unexpected digest '$digest'" >&2; exit 1; }
          echo "notebook-cpu-image=aperturedata/aperturedb-notebook-cpu@$digest" >> "$GITHUB_OUTPUT"

      - name: Check published inputs
        id: inputs
        env:
          # Pull requests and manual runs always build; they publish nothing.
          FORCE_BUILD: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
          SDK_REF: ${{ steps.sdk.outputs.ref }}
          WORKFLOWS_REF: ${{ steps.sdk.outputs.workflows-ref }}
          NOTEBOOK_CPU_IMAGE: ${{ steps.sdk.outputs.notebook-cpu-image }}
        run: |
          # shellcheck disable=SC2086 # the app lists are space-separated
          bash scripts/check-published-inputs.sh "$(cat VERSION)" aperturedata/workflows- $SMALL_APPS $LARGE_APPS \
            -- "$SDK_REF" "$WORKFLOWS_REF" "$NOTEBOOK_CPU_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Split the builds by job
        id: matrix
        env:
          BUILDS: ${{ steps.inputs.outputs.builds }}
        run: |
          pick() { jq -cn --argjson builds "$BUILDS" '$ARGS.positional | map(select(IN($builds[])))' --args "$@"; }
          # shellcheck disable=SC2086 # the app lists are space-separated
          {
            echo "small=$(pick $SMALL_APPS)"
            echo "large=$(pick $LARGE_APPS)"
          } >> "$GITHUB_OUTPUT"

  build-base:
    needs: get-version
    if: needs.get-version.outputs.build == 'true'
    runs-on: [self-hosted, X64]
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
      SDK_REF: ${{ needs.get-version.outputs.sdk-ref }}
      WORKFLOWS_REF: ${{ needs.get-version.outputs.workflows-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - name: Build base
        run: |
          cd base/docker
          WORKFLOW_VERSION=$VERSION bash build.sh

      - name: Build and export
        run: |
          docker save --output="${{ runner.temp }}/workflows-base.tar" "aperturedata/workflows-base:$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflows-base
          path: ${{ runner.temp }}/workflows-base.tar

  test-base:
    needs: [build-base, get-version]
    runs-on: [self-hosted, X64]
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download base image
        uses: actions/download-artifact@v4
        with:
          name: workflows-base
          path: ${{ runner.temp }}

      - name: Load base image
        run: |
          docker load --input=${{ runner.temp }}/workflows-base.tar

      - name: Test base modules
        run: |
          cd base/docker
          CI_RUN=1 bash test.sh

  build-test-apps-small:
    needs: [test-base, get-version]
    if: needs.get-version.outputs.small != '[]'

    strategy:
      fail-fast: false
      matrix:
        # SMALL_APPS in get-version, less the apps whose inputs are unchanged.
        app: ${{ fromJson(needs.get-version.outputs.small) }}
    runs-on: [self-hosted, X64]
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
      INPUT_HASH: ${{ fromJson(needs.get-version.outputs.input-hashes)[matrix.app] }}
      # The CPU notebook digest in the input hash; jupyterlab builds on it.
      NOTEBOOK_CPU_IMAGE: ${{ needs.get-version.outputs.notebook-cpu-image }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: workflows-base
          path: ${{ runner.temp }}

      - name: Load image
        run: |
          docker load --input ${{ runner.temp }}/workflows-base.tar
          docker image ls -a

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ fromJson(secrets.DOCKERHUB).username }}
          DOCKERHUB_PASSWORD: ${{ fromJson(secrets.DOCKERHUB).password }}
        run: |
          printf '%s' "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - uses: actions/checkout@v4

      - name: Set up Docker Compose
        # docker-compose.yml includes the ApertureDB Compose package (oci://).
        uses: docker/setup-compose-action@v1
        with:
          version: v2.40.3

      - name: Test app
        env:
          CLEANUP: "true"
          WF_LOGS_AWS_CREDENTIALS: ${{ secrets.WF_LOGS_AWS_CREDENTIALS }}
          WF_DATA_SOURCE_GCP_BUCKET: ${{ secrets.WF_DATA_SOURCE_GCP_BUCKET }}
          RUNNER_NAME: ${{ runner.name }}
          WORKFLOW_VERSION: ${{ needs.get-version.outputs.version }}
          CI_RUN: 1
        run: |
          cd apps/${{ matrix.app }}
          if [ "${{ matrix.app }}" = "embeddings-extraction" ]; then
            export TEST_METADATA_DIR="$PWD/test-results"
            mkdir -p "$TEST_METADATA_DIR"
          fi
          if [ -f "test.sh" ]; then
            bash test.sh
          else
            bash ../build.sh
          fi

      - name: Upload workflow test results
        if: always() && (matrix.app == 'ocr-extraction' || matrix.app == 'embeddings-extraction')
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.app }}
          path: apps/${{ matrix.app }}/test-results/*.xml
          if-no-files-found: ignore

      - name: Verify embedding phase metadata
        if: always() && matrix.app == 'embeddings-extraction'
        run: |
          jq -e '.phase and (.exit_code | type == "number") and (.containers | type == "array")' apps/embeddings-extraction/test-results/test-state.json

      - name: Upload embedding phase metadata
        if: always() && matrix.app == 'embeddings-extraction'
        uses: actions/upload-artifact@v4
        with:
          name: phase-state-embeddings-extraction
          path: apps/embeddings-extraction/test-results/test-state.json
          if-no-files-found: error

      - name: Push to docker (on main)
        # Only push to docker when merged to main
        if: (github.event_name == 'push' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/main'
        run: |
          bash scripts/push-app.sh "${{ matrix.app }}"

  build-test-apps-large:
    needs: [test-base, get-version]
    if: needs.get-version.outputs.large != '[]'

    strategy:
      matrix:
        # LARGE_APPS in get-version, less the apps whose inputs are unchanged.
        app: ${{ fromJson(needs.get-version.outputs.large) }}

    runs-on: [self-hosted, X64]
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
      INPUT_HASH: ${{ fromJson(needs.get-version.outputs.input-hashes)[matrix.app] }}
      # The CPU notebook digest in the input hash; jupyterlab builds on it.
      NOTEBOOK_CPU_IMAGE: ${{ needs.get-version.outputs.notebook-cpu-image }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: workflows-base
          path: ${{ runner.temp }}

      - name: Load image
        run: |
          docker load --input ${{ runner.temp }}/workflows-base.tar
          docker image ls -a

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ fromJson(secrets.DOCKERHUB).username }}
          DOCKERHUB_PASSWORD: ${{ fromJson(secrets.DOCKERHUB).password }}
        run: |
          printf '%s' "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - uses: actions/checkout@v4

      - name: Set up Docker Compose
        # docker-compose.yml includes the ApertureDB Compose package (oci://).
        uses: docker/setup-compose-action@v1
        with:
          version: v2.40.3

      - name: Test app
        env:
          CLEANUP: "true"
          WF_LOGS_AWS_CREDENTIALS: ${{ secrets.WF_LOGS_AWS_CREDENTIALS }}
          WF_DATA_SOURCE_GCP_BUCKET: ${{ secrets.WF_DATA_SOURCE_GCP_BUCKET }}
          RUNNER_NAME: ${{ runner.name }}
          WORKFLOW_VERSION: ${{ needs.get-version.outputs.version }}
          CI_RUN: 1
        run: |
          cd apps/${{ matrix.app }}
          if [ -f "test.sh" ]; then
            bash test.sh
          else
            bash ../build.sh
          fi

      # ⬇️ Upload logs even if the tests fail
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/test.log
          if-no-files-found: ignore

      - name: Push to docker (on main)
        # Only push to docker when merged to main
        if: (github.event_name == 'push' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/main'
        run: |
          bash scripts/push-app.sh "${{ matrix.app }}"

  update-version:
    needs: [get-version, build-base, test-base, build-test-apps-small, build-test-apps-large]
    runs-on: ubuntu-latest
    # Jobs with nothing to build are skipped; any failure stops the report.
    if: >-
      ${{ !cancelled() && !contains(needs.*.result, 'failure')
      && (github.event_name == 'push' || github.event_name == 'repository_dispatch')
      && github.ref == 'refs/heads/main' }}
    env:
      VERSION: ${{ needs.get-version.outputs.version }}

    steps:
      - name: Update version on infra develop
        run: |
          curl -f -s -X POST \
          -H "Authorization: Bearer ${{ secrets.PAT_INFRA }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/aperture-data/infra/dispatches \
          -d "{\"event_type\": \"update-tag\", \"client_payload\": {\"component\": \"workflows\", \"tag\": \"${VERSION}\"}}"
