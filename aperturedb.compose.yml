# Merged into the ApertureDB Docker Compose package by docker-compose.yml.
services:
    # Workflows and their tests wait for the database and the gateway.
    aperturedb:
        healthcheck:
            test:
                - CMD-SHELL
                - "bash -c 'echo > /dev/tcp/127.0.0.1/55553'"
            interval: 2s
            timeout: 1s
            retries: 60

    lenz:
        depends_on:
            aperturedb:
                condition: service_healthy
            ca-export:
                condition: service_completed_successfully
        healthcheck:
            test:
                - CMD-SHELL
                - "bash -c 'echo > /dev/tcp/127.0.0.1/55551'"
            interval: 2s
            timeout: 1s
            retries: 60
        # Workflows reach lenz on the project network only.
        ports: !reset []

    # Workflows trust the generated certificate as /ca/ca.crt. It is valid
    # for lenz and http-proxy.
    ca-export:
        image: alpine:3
        depends_on:
            ca:
                condition: service_completed_successfully
        entrypoint: ["/bin/sh", "-ec"]
        command: ["cp /cert/tls.crt /ca/ca.crt && chmod 644 /ca/ca.crt"]
        volumes:
            - certificate_volume:/cert:ro
            - ./ca:/ca
