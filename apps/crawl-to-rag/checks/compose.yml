# The database comes from the published ApertureDB Docker Compose package;
# no-ports.yml keeps it off the host's ports.
include:
  - path:
      - oci://aperturedata/aperturedb-compose-single-node:${APERTUREDB_VERSION:-dev}
      - no-ports.yml
    project_directory: .
services:
  tests:
    image: aperturedata/workflows-base:${VERSION:-v1.0.2}
    depends_on:
      - aperturedb
      - lenz
    volumes:
      - ../..:/apps:ro
    command: ['python', '/apps/crawl-to-rag/checks/test_constraints.py']
