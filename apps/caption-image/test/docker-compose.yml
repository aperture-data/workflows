services:
  test-base:
    build:
      context: apps/caption-image/test
      dockerfile: Dockerfile
    image: aperturedata/workflows-caption-image-tests:${VERSION:-latest}
    deploy:
      replicas: 0

  seed:
    image: aperturedata/workflows-caption-image-tests:${VERSION:-latest}
    depends_on:
      lenz:
        condition: service_healthy
    working_dir: /app
    environment:
      DB_HOST: lenz
      DB_PORT: 55551
      DB_USER: admin
      DB_PASS: admin
      CA_CERT: /ca/ca.crt
    volumes:
      - ./ca:/ca
    command: ["python", "/app/seed.py"]

  caption-image:
    image: aperturedata/workflows-caption-image:${VERSION:-latest}
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      DB_HOST: lenz
      DB_PORT: 55551
      DB_USER: admin
      DB_PASS: admin
      CA_CERT: /ca/ca.crt
      RUN_ONCE: "true"
    volumes:
      - ./ca:/ca

  tests:
    image: aperturedata/workflows-caption-image-tests:${VERSION:-latest}
    depends_on:
      caption-image:
        condition: service_completed_successfully
    environment:
      DB_HOST: lenz
      DB_PORT: 55551
      DB_USER: admin
      DB_PASS: admin
      CA_CERT: /ca/ca.crt
    working_dir: /app
    volumes:
      - ./ca:/ca
    command: ["pytest",  "-vv", "-s", "-rA", "--log-cli-level=DEBUG"]
